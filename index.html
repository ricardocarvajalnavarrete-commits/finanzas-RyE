/* ============ CRIPTOGRAFÍA (SHA-256 puro JS) ============ */
var sha256=function(ascii){
 function rightRotate(v,a){return (v>>>a)|(v<<(32-a));}
 var mathPow=Math.pow,maxWord=mathPow(2,32),len='length',i,j,result='';
 var words=[],asciiBitLength=ascii[len]*8;
 var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],primeCounter=k[len];
 var isComposite={};
 for(var candidate=2;primeCounter<64;candidate++){
  if(!isComposite[candidate]){
   for(i=0;i<313;i+=candidate)isComposite[i]=candidate;
   hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
   k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
  }
 }
 ascii+='\x80';
 while(ascii[len]%64-56)ascii+='\x00';
 for(i=0;i<ascii[len];i++){j=ascii.charCodeAt(i);if(j>>8)return;words[i>>2]|=j<<((3-i)%4)*8;}
 words[words[len]]=((asciiBitLength/maxWord)|0);
 words[words[len]]=(asciiBitLength);
 for(j=0;j<words[len];){
  var w=words.slice(j,j+=16),oldHash=hash;hash=hash.slice(0,8);
  for(i=0;i<64;i++){
   var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
   var temp1=hash[7]+(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
    +(w[i]=(i<16)?w[i]:(w[i-16]+(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))+w[i-7]+(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10)))|0);
   var temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(temp1+temp2)|0].concat(hash);hash[4]=(hash[4]+temp1)|0;
  }
  for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;
 }
 for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16);}}
 return result;
};
function sha256s(s){ return sha256(unescape(encodeURIComponent(s))); }
function genSalt(){var s='',c='abcdef0123456789';for(var i=0;i<16;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function kdf(pass,salt){ var kk=unescape(encodeURIComponent(pass))+salt; for(var i=0;i<2000;i++)kk=sha256(kk); return kk; }
function hashPass(pass,salt){ return kdf(pass,salt); }
function strToBytes(str){ var s=unescape(encodeURIComponent(str)),o=[]; for(var i=0;i<s.length;i++)o.push(s.charCodeAt(i)); return o; }
function bytesToStr(bytes){ var s=''; bytes.forEach(function(b){s+=String.fromCharCode(b);}); return decodeURIComponent(escape(s)); }
function bytesToB64(bytes){ var s=''; bytes.forEach(function(b){s+=String.fromCharCode(b);}); return btoa(s); }
function b64ToBytes(b64){ var s=atob(b64),o=[]; for(var i=0;i<s.length;i++)o.push(s.charCodeAt(i)); return o; }
function keystream(key,nonce,len){
 var out=[],c=0;
 while(out.length<len){
  var h=sha256(key+':'+nonce+':'+c);
  for(var i=0;i<h.length;i+=2)out.push(parseInt(h.substr(i,2),16));
  c++;
 }
 return out.slice(0,len);
}
function encryptBackup(jsonStr,pass){
 var salt=genSalt(),key=kdf(pass,salt),nonce=genSalt();
 var bytes=strToBytes(jsonStr);
 var ks=keystream(key,nonce,bytes.length);
 var enc=bytes.map(function(b,i){return b^ks[i];});
 var tag=sha256(key+':'+sha256s(jsonStr));
 return {v:1,salt:salt,nonce:nonce,tag:tag,data:bytesToB64(enc)};
}
function decryptBackup(obj,pass){
 var key=kdf(pass,obj.salt);
 var bytes=b64ToBytes(obj.data);
 var ks=keystream(key,obj.nonce,bytes.length);
 var dec=bytes.map(function(b,i){return b^ks[i];});
 var str=bytesToStr(dec);
 var tag=sha256(key+':'+sha256s(str));
 if(tag!==obj.tag)return null;
 return str;
}

/* ============ SINCRONIZACIÓN EN LA NUBE (Firebase REST) ============ */
let syncTimer=null, suppressPush=false;
function syncReady(){ return db.sync&&db.sync.enabled&&db.sync.url&&db.sync.room; }
function syncPath(){ return db.sync.url.replace(/\/$/,'')+'/'+db.sync.room+'/data.json'; }
function pushCloud(){
 if(!syncReady()||suppressPush)return;
 fetch(syncPath(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({updatedAt:db.updatedAt,payload:db})})
  .then(()=>{ db.sync.lastSync=Date.now(); persist(); if(view==='ajustes')updateSyncUI(); })
  .catch(()=>{});
}
function pullCloud(){
 if(!syncReady())return;
 fetch(syncPath()).then(r=>r.ok?r.json():null).then(remote=>{
  if(remote&&remote.updatedAt&&remote.updatedAt>(db.updatedAt||0)){
   suppressPush=true;
   db=remote.payload; persist(); render();
   setTimeout(()=>{suppressPush=false;},300);
  }
  if(remote){ db.sync=db.sync||{}; db.sync.lastSync=Date.now(); persist(); if(view==='ajustes')updateSyncUI(); }
 }).catch(()=>{});
}
function startSync(){ if(syncTimer){clearInterval(syncTimer);syncTimer=null;} if(syncReady()){ pullCloud(); syncTimer=setInterval(pullCloud,10000); } }
function save(){ db.updatedAt=Date.now(); persist(); pushCloud(); }
function manualSync(){ if(!syncReady()){alert('Primero configura y activa la sincronización.');return;} pushCloud(); pullCloud(); alert('🔄 Sincronizando…'); }
function genRoom(){ let s='';const c='abcdefghijkmnpqrstuvwxyz23456789';for(let i=0;i<12;i++)s+=c[Math.floor(Math.random()*c.length)];return s; }
function syncConfigModal(){
 showModal({title:'Configurar base de datos en la nube',values:{url:(db.sync&&db.sync.url)||''},fields:[
  {n:'url',l:'URL de Firebase Realtime Database',ph:'https://tu-proyecto-default-rtdb.firebaseio.com'}
 ],submit:data=>{
  let u=(data.url||'').trim();
  if(!u){ alert('Ingresa la URL de la base de datos.'); return false; }
  if(!/^https:\/\//i.test(u)){ alert('La URL debe comenzar con https://'); return false; }
  db.sync=db.sync||{}; db.sync.url=u.replace(/\/$/,'');
  if(!db.sync.room)db.sync.room=genRoom();
  save(); render();
 }});
}
function syncCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify({u:db.sync.url,r:db.sync.room})))); }
function copySyncCode(){
 if(!db.sync||!db.sync.url){ alert('Primero configura la base de datos.'); return; }
 const c=syncCode();
 if(navigator.clipboard){ navigator.clipboard.writeText(c).then(()=>alert('📋 Código copiado.\nPégalo en el otro dispositivo con "Vincular este dispositivo".')); }
 else{ prompt('Copia este código:',c); }
}
function linkDeviceModal(){
 showModal({title:'Vincular este dispositivo',values:{},fields:[
  {n:'code',l:'Código de vinculación',ph:'Pega aquí el código copiado del otro dispositivo'}
 ],submit:data=>{
  try{
   const o=JSON.parse(decodeURIComponent(escape(atob((data.code||'').trim()))));
   if(!o.u||!o.r)throw 0;
   db.sync=db.sync||{}; db.sync.url=o.u; db.sync.room=o.r; db.sync.enabled=true;
   save(); startSync(); render(); alert('✅ Dispositivo vinculado y sincronización activada.');
  }catch(e){ alert('Código inválido. Cópialo completo desde el otro dispositivo.'); return false; }
 }});
}
function toggleSync(){
 db.sync=db.sync||{};
 if(!db.sync.url){ syncConfigModal(); return; }
 db.sync.enabled=!db.sync.enabled; save();
 if(db.sync.enabled)startSync(); else { if(syncTimer){clearInterval(syncTimer);syncTimer=null;} }
 render();
}
function updateSyncUI(){
 const st=$('#sync-status'); if(!st)return;
 if(!db.sync||!db.sync.url){ st.innerHTML='<div class="al warn">No configurada. Presiona <b>"Configurar base de datos"</b> para comenzar.</div>'; }
 else if(!db.sync.enabled){ st.innerHTML='<div class="al warn">Configurada pero <b>desactivada</b> · '+esc(db.sync.url.replace('https://',''))+'</div>'; }
 else { st.innerHTML='<div class="al ok">☁️ Sincronización <b>activa</b> · Sala <b>'+esc(db.sync.room)+'</b>'+(db.sync.lastSync?' · Últ. movimiento: '+new Date(db.sync.lastSync).toLocaleTimeString('es-CL'):'')+'</div>'; }
 const btn=$('#btnSyncToggle'); if(btn)btn.textContent=(db.sync&&db.sync.enabled)?'⏸️ Desactivar':'▶️ Activar';
 const det=$('#sync-detail'); if(det)det.innerHTML=db.sync&&db.sync.url?('URL: '+esc(db.sync.url)+'<br>Para conectar el celular: en él abre la app → Ajustes → "Vincular este dispositivo" y pega el código.'):'Crea una base gratis en <b>firebase.google.com</b> → Realtime Database, copia su URL y pégala en "Configurar base de datos".';
}

/* ============ CÁLCULOS ============ */
function gastoDeMes(m){ return db.gastos.filter(g=>g.fecha&&g.fecha.startsWith(m)).reduce((a,g)=>a+(+g.monto||0),0); }
function gastosDelMes(){ return gastoDeMes(mesActual()); }
function ingresoFamiliar(){ return db.ingresos.reduce((a,i)=>a+(+i.monto||0),0); }
function gastosPorCat(m){ const o={}; db.gastos.filter(g=>g.fecha&&g.fecha.startsWith(m)).forEach(g=>{o[g.categoria]=(o[g.categoria]||0)+(+g.monto||0);}); return o; }
function totalAutoAporte(){ return db.metas.reduce((a,m)=>a+(+m.aporteAuto||0),0); }
function applyAutoAportes(){
 const m=mesActual(); let applied=0;
 db.metas.forEach(mt=>{
  if(mt.aporteAuto>0 && mt.ultimoAporte!==m){
   mt.ahorrado=(+mt.ahorrado||0)+(+mt.aporteAuto);
   mt.historial=mt.historial||[];
   mt.historial.push({mes:m,monto:+mt.aporteAuto,tipo:'auto'});
   if(mt.historial.length>24)mt.historial=mt.historial.slice(-24);
   mt.ultimoAporte=m; applied++;
  }
 });
 if(applied>0){ db.updatedAt=Date.now(); persist(); pushCloud(); }
 return applied;
}
function stats(){
 const act=db.deudas.filter(d=>d.estado!=='Pagada');
 const deudaTotal=act.reduce((a,d)=>a+(+d.saldo||0),0);
 const cuotas=act.reduce((a,d)=>a+(+d.cuota||0),0);
 const mora=act.filter(d=>d.estado==='En mora');
 const moraTotal=mora.reduce((a,d)=>a+(+d.saldo||0),0);
 const servicios=db.servicios.reduce((a,s)=>a+(+s.monto||0),0);
 const ingresos=ingresoFamiliar();
 const obligaciones=cuotas+servicios;
 const gastos=gastosDelMes();
 const autoAporte=totalAutoAporte();
 const capacidad=ingresos-obligaciones;
 const carga=ingresos>0?obligaciones/ingresos:null;
 const porPersona={}; PERSONAS.forEach(p=>porPersona[p]=act.filter(d=>d.responsable===p).reduce((a,d)=>a+(+d.saldo||0),0));
 return {deudaTotal,cuotas,mora,moraTotal,servicios,ingresos,obligaciones,gastos,autoAporte,capacidad,carga,porPersona,nDeudas:act.length};
}
function alertas(s){
 const A=[];
 if(s.ingresos<=0)A.push({t:'warn',x:'<b>Faltan ingresos:</b> regístrenlos en la página <a class="link" onclick="nav(\'ingresos\')">Ingresos</a> para activar proyecciones y consejos personalizados.'});
 if(s.mora.length)A.push({t:'bad',x:'<b>'+s.mora.length+' deudas en mora</b> por '+fmt(s.moraTotal)+'. Revisa la página de Consejos para ver el plan de pago sugerido.'});
 const ex=db.deudas.filter(d=>d.estado!=='Pagada'&&d.limite>0&&d.saldo>d.limite);
 if(ex.length)A.push({t:'warn',x:'<b>Sobregiro:</b> '+ex.map(d=>esc(d.nombre)).join(', ')+'. Eviten nuevas compras con esas tarjetas.'});
 db.servicios.filter(x=>x.estado!=='Pagada'&&x.vence).forEach(x=>{ const d=diasHasta(x.vence); if(d<0)A.push({t:'bad',x:'<b>'+esc(x.nombre)+'</b> venció hace '+(-d)+' días ('+fmt(x.monto)+').'}); else if(d<=7)A.push({t:'warn',x:'<b>'+esc(x.nombre)+'</b> vence en '+d+' día(s) ('+fmt(x.monto)+').'}); });
 if(s.carga!=null&&s.carga>0.5)A.push({t:'bad',x:'<b>Carga financiera crítica:</b> el '+Math.round(s.carga*100)+'% de los ingresos se va en obligaciones (recomendado: bajo 35%).'});
 else if(s.carga!=null&&s.carga>0.35)A.push({t:'warn',x:'<b>Carga financiera alta:</b> '+Math.round(s.carga*100)+'% de los ingresos en obligaciones.'});
 const gC=gastosPorCat(mesActual());
 Object.entries(db.presupuesto||{}).forEach(([c,l])=>{ if(l>0&&(gC[c]||0)>l)A.push({t:'warn',x:'<b>Presupuesto excedido</b> en '+esc(c)+': llevan '+fmt(gC[c])+' de '+fmt(l)+' este mes.'}); });
 return A;
}

/* --- Gastos + Presupuesto --- */
const CATEGORIAS=['Supermercado','Transporte','Comida y Restaurant','Salud','Educación','Entretención','Ropa y Calzado','Hogar','Mascotas','Suscripciones','Otros'];
const CAT_COLORS=['#34d399','#60a5fa','#f59e0b','#f87171','#a78bfa','#f472b6','#fbbf24','#38bdf8','#4ade80','#c084fc','#94a3b8'];
const MEDIOS=['Efectivo','Débito','Crédito','Transferencia','Prepago/Billetera','Otro'];
let fG={mes:'',cat:''};
function vGastos(){
 if(!fG.mes)fG.mes=mesActual();
 return '<div class="toolbar">'
 +'<input type="month" value="'+fG.mes+'" onchange="fG.mes=this.value;fillGastos()">'
 +'<select onchange="fG.cat=this.value;fillGastos()"><option value="">Todas las categorías</option>'+CATEGORIAS.map(c=>'<option '+(fG.cat===c?'selected':'')+'>'+c+'</option>').join('')+'</select>'
 +'<span class="spacer"></span>'
 +'<button class="btn" onclick="presuModal()">🎛️ Presupuestos</button>'
 +'<button class="btn primary" onclick="gastoModal()">＋ Nuevo gasto</button></div>'
 +'<div id="gastos-sum"></div>'
 +'<div id="presu-box"></div>'
 +'<div class="grid2"><div class="card"><h3>Gastos por categoría</h3><div class="donutwrap"><canvas id="cGasto"></canvas><div id="gastoLeg" class="leg"></div></div></div>'
 +'<div class="card"><h3>Top categorías</h3><div id="gastoResumen"></div></div></div>'
 +'<div id="gastos-list"></div>';
}
function fillGastos(){
 const list=db.gastos.filter(g=>(!fG.mes||!g.fecha||g.fecha.startsWith(fG.mes))&&(!fG.cat||g.categoria===fG.cat));
 const total=list.reduce((a,g)=>a+(+g.monto||0),0);
 const byCat={};
 list.forEach(g=>{ byCat[g.categoria]=(byCat[g.categoria]||0)+(+g.monto||0); });
 const entries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
 const s=stats();
 const libre=s.ingresos-s.obligaciones-total-s.autoAporte;
 $('#gastos-sum').innerHTML='<div class="chips"><span class="chip">Total del período: <b>'+fmt(total)+'</b></span>'
 +'<span class="chip">Ahorro programado: <b>'+fmt(s.autoAporte)+'</b></span>'
 +(s.ingresos>0?'<span class="chip">Libre tras obligaciones, gastos y ahorro: <b>'+fmt(libre)+'</b></span>':'')
 +'</div>';
 fillPresu();
 donut($('#cGasto'), entries.map(([c,v])=>({label:c,value:v,color:CAT_COLORS[CATEGORIAS.indexOf(c)]||'#94a3b8'})), fmt(total));
 $('#gastoLeg').innerHTML=entries.map(([c,v])=>'<div class="lrow"><span class="dot" style="background:'+(CAT_COLORS[CATEGORIAS.indexOf(c)]||'#94a3b8')+'"></span>'+c+' <b>'+fmt(v)+'</b> <span class="mut">'+(total?Math.round(v/total*100):0)+'%</span></div>').join('')||'<span class="mut">Sin gastos en este período.</span>';
 $('#gastoResumen').innerHTML=entries.slice(0,6).map(([c,v])=>'<div class="bar-row"><div>'+c+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(entries[0][1]?Math.max(4,v/entries[0][1]*100):0)+'%;background:'+(CAT_COLORS[CATEGORIAS.indexOf(c)]||'#94a3b8')+'"></div></div><div class="bar-val">'+fmt(v)+'</div></div>').join('')||'<span class="mut">Sin datos.</span>';
 const sorted=[...list].sort((a,b)=>b.fecha.localeCompare(a.fecha));
 $('#gastos-list').innerHTML='<div class="card nopad"><div class="tscroll"><table class="tbl"><thead><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th>Monto</th><th>Responsable</th><th>Medio</th><th></th></tr></thead><tbody>'
 +sorted.map(g=>'<tr><td>'+fdate(g.fecha)+'</td><td><b>'+esc(g.desc)+'</b></td><td><span class="dot" style="background:'+(CAT_COLORS[CATEGORIAS.indexOf(g.categoria)]||'#94a3b8')+'"></span> '+esc(g.categoria)+'</td><td>'+fmt(g.monto)+'</td><td>'+esc(g.responsable)+'</td><td class="mut small">'+esc(g.medio||'')+'</td><td class="acts"><button class="ibtn" onclick="gastoModal(\''+g.id+'\')">✏️</button><button class="ibtn" onclick="delGasto(\''+g.id+'\')">🗑️</button></td></tr>').join('')
 +'</tbody></table></div></div>';
}
function fillPresu(){
 const m=fG.mes||mesActual();
 const gCat=gastosPorCat(m);
 const entries=Object.entries(db.presupuesto||{}).filter(([c,l])=>l>0);
 if(!entries.length){
  $('#presu-box').innerHTML='<div class="card"><h3>🎛️ Presupuesto del mes</h3><p class="mut">Aún no han definido límites por categoría. <button class="btn primary" style="margin-left:8px" onclick="presuModal()">Definir presupuestos</button></p></div>';
  return;
 }
 const rows=entries.map(([c,l])=>{
  const g=gCat[c]||0; const pct=Math.round(g/l*100); const w=Math.min(100,pct);
  const col=pct>100?'#f0647a':pct>=80?'#f5b942':'#2dd4a7';
  const icon=pct>100?'⚠️ ':'';
  return '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px"><span>'+icon+esc(c)+'</span><span class="mut">'+fmt(g)+' / '+fmt(l)+' · <b style="color:'+col+'">'+pct+'%</b></span></div>'
  +'<div class="bar-track"><div class="bar-fill" style="width:'+w+'%;background:'+col+'"></div></div></div>';
 }).join('');
 $('#presu-box').innerHTML='<div class="card"><button class="btn" style="float:right;padding:5px 12px;font-size:.78rem" onclick="presuModal()">✏️ Editar</button><h3>🎛️ Presupuesto de '+mesLabel(m)+'</h3>'+rows+'</div>';
}
function presuModal(){
 const vals={}; CATEGORIAS.forEach(c=>vals['c_'+c]=db.presupuesto[c]||'');
 showModal({title:'Presupuestos mensuales por categoría',values:vals,
  fields:CATEGORIAS.map(c=>({n:'c_'+c,l:c+' ($/mes)',type:'number',ph:'Sin límite'})),
  submit:data=>{
   db.presupuesto={};
   CATEGORIAS.forEach(c=>{ const v=+data['c_'+c]||0; if(v>0)db.presupuesto[c]=v; });
   save();
 }});
}

function mesesHist(){

 db.gastos.forEach(g=>{ if(g.fecha) set.add(g.fecha.slice(0,7)); });
 Object.keys(db.histoIngresos||{}).forEach(m=>set.add(m));
 set.add(mesActual());
 return [...set].sort().reverse().slice(0,12).reverse();
}
function fillHist(){
 const meses=mesesHist();
 const ingActual=ingresoFamiliar();

 const bal=data.reduce((a,d)=>a+d.ingresos-d.gastos,0);
 $('#hist-chip').innerHTML='Balance del período: <b class="'+(bal>=0?'':'bad-t')+'">'+fmt(bal)+'</b>';
 barsChart($('#cHist'),data.map(d=>mesLabelCorto(d.m)),
  [{name:'Ingresos',color:'#2dd4a7',data:data.map(d=>d.ingresos)},
   {name:'Gastos',color:'#f0647a',data:data.map(d=>d.gastos)}]);
 $('#hist-list').innerHTML='<div class="card nopad"><div class="tscroll"><table class="tbl"><thead><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Balance</th><th>% gastado</th><th></th></tr></thead><tbody>'
 +[...data].reverse().map(d=>{
   const b=d.ingresos-d.gastos;

 }).join('')
 +'</tbody></table></div></div>';

const META_COLORS=['#6d7ff5','#22d3ee','#34d399','#f59e0b','#f472b6','#a78bfa','#fbbf24','#38bdf8'];
function vMetas(){
 return '<div class="toolbar"><button class="btn" onclick="applyAndRender()">⚡ Aplicar aportes del mes</button><span class="spacer"></span><button class="btn primary" onclick="metaModal()">＋ Nueva meta de ahorro</button></div>'
 +'<div id="metas-sum"></div>'
 +'<div class="grid2" id="metas-grid"></div>';
}
function applyAndRender(){ const n=applyAutoAportes(); render(); if(n>0)alert('⚡ Se aplicaron '+n+' aporte(s) automático(s).'); else alert('No hay aportes pendientes este mes.'); }
function fillMetas(){
 const totalAh=db.metas.reduce((a,m)=>a+(+m.ahorrado||0),0);
 const totalObj=db.metas.reduce((a,m)=>a+(+m.objetivo||0),0);
 const autoMes=totalAutoAporte();
 $('#metas-sum').innerHTML='<div class="chips"><span class="chip">Total ahorrado: <b>'+fmt(totalAh)+'</b></span><span class="chip">Meta total: <b>'+fmt(totalObj)+'</b></span>'+(totalObj?'<span class="chip">Avance: <b>'+Math.round(totalAh/totalObj*100)+'%</b></span>':'')+'<span class="chip">Aporte automático: <b>'+fmt(autoMes)+'/mes</b></span></div>';
 if(!db.metas.length){ $('#metas-grid').innerHTML='<div class="card" style="grid-column:1/-1"><p class="mut">Aún no tienen metas de ahorro. Creen la primera, por ejemplo un fondo de emergencia o un viaje. 🎯</p></div>'; return; }
 const m=mesActual();
 $('#metas-grid').innerHTML=db.metas.map((mt,i)=>{
   const pct=Math.min(100,Math.round((+mt.ahorrado||0)/(+mt.objetivo||1)*100));
   const color=META_COLORS[i%META_COLORS.length];
   const faltante=Math.max(0,(+mt.objetivo||0)-(+mt.ahorrado||0));
   let guia='';
   if(mt.plazo&&faltante>0){
     const plazo=new Date(mt.plazo+'T00:00:00');
     const months=Math.max(1,Math.round((plazo-new Date())/(30*864e5)));
     const req=faltante/months;
     guia='<p class="mut small" style="margin-top:8px">Para llegar al '+fdate(mt.plazo)+' necesitan ~<b style="color:'+color+'">'+fmt(req)+'/mes</b>.</p>';
   } else if(faltante<=0){
     guia='<p class="small" style="margin-top:8px;color:#2dd4a7">✅ ¡Meta cumplida!</p>';
   }
   const autoBadge=mt.aporteAuto>0?(mt.ultimoAporte===m?'<span class="b ok">Aporte del mes aplicado</span>':'<span class="b warn">Aporte del mes pendiente</span>'):'';
   const hist=(mt.historial||[]).slice(-4).reverse().map(h=>'<span class="hist-chip">'+mesLabelCorto(h.mes)+' +'+fmt(h.monto)+(h.tipo==='auto'?' ⚡':' ✋')+'</span>').join('');
   return '<div class="card">'
     +'<div class="person-head"><span class="avatar" style="background:'+color+'">'+esc((mt.nombre||'?')[0])+'</span><div><h3>'+esc(mt.nombre)+'</h3><div class="mut small">'+esc(mt.responsable||'—')+'</div></div>'
     +'<div style="margin-left:auto" class="acts"><button class="ibtn" title="Abonar" onclick="abonoModal(\''+mt.id+'\')">💰</button><button class="ibtn" onclick="metaModal(\''+mt.id+'\')">✏️</button><button class="ibtn" onclick="delMeta(\''+mt.id+'\')">🗑️</button></div></div>'
     +'<div class="big" style="color:'+color+'">'+pct+'%</div>'
     +'<div class="bar-track" style="height:14px;margin:8px 0"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'
     +'<div class="mut small">Ahorrado: <b>'+fmt(mt.ahorrado)+'</b> de '+fmt(mt.objetivo)+' · Falta: <b>'+fmt(faltante)+'</b></div>'
     +(mt.aporteAuto>0?'<div class="mut small" style="margin-top:4px">⚡ Aporte automático: <b>'+fmt(mt.aporteAuto)+'/mes</b> '+autoBadge+'</div>':'')
     +guia
     +(hist?'<div class="hist-mini">'+hist+'</div>':'')
     +'</div>';
 }).join('');
}
function metaModal(id){
 const mt=id?db.metas.find(x=>x.id===id):{};

 +'<label>Rentabilidad anual (%)<input type="number" id="par" value="8" step="0.1" oninput="calcAhorro()"></label>'
 +'<label>Años<input type="number" id="pay" value="5" min="1" max="40" oninput="calcAhorro()"></label></div>'
 +'<div class="res3"><div><div class="mut small">Monto final</div><b id="rFinal">—</b></div><div><div class="mut small">Total aportado</div><b id="rAportes">—</b></div><div><div class="mut small">Intereses ganados</div><b id="rInt">—</b></div></div>'
 +'<canvas id="cAhorro"></canvas></div>'

 +'<div class="fgrid"><label>Deuda total ($)<input type="number" id="pd0" value="'+Math.round(s.deudaTotal)+'" oninput="calcDeuda()"></label>'
 +'<label>Pago mensual ($)<input type="number" id="pdm" value="'+Math.round(s.cuotas||200000)+'" oninput="calcDeuda()"></label>'
 +'<label>Tasa anual promedio (%)<input type="number" id="pdr" value="35" step="0.1" oninput="calcDeuda()"></label></div>'
 +'<div id="rDeuda"></div></div></div>';

function calcAhorro(){
 const P=+($('#pa0').value)||0, A=+($('#pam').value)||0, R=(+($('#par').value)||0)/100;
 const Y=Math.max(1,Math.min(40,+($('#pay').value)||1));
 const r=R/12, n=Y*12; const pts=[P]; let v=P;
 for(let m=1;m<=n;m++){ v=v*(1+r)+A; pts.push(v); }
 $('#rFinal').textContent=fmt(v);
 $('#rAportes').textContent=fmt(P+A*n);
 $('#rInt').textContent=fmt(v-(P+A*n));
 areaChart($('#cAhorro'),pts);
}
function calcDeuda(){
 const D0=+($('#pd0').value)||0, M=+($('#pdm').value)||0, R=(+($('#pdr').value)||0)/100/12;
 const box=$('#rDeuda');
 if(D0<=0){ box.innerHTML='<div class="al ok">Sin deuda registrada. 🎉</div>'; return; }
 if(M<=0){ box.innerHTML=''; return; }
 let n;
 if(R===0){ n=Math.ceil(D0/M); }
 else{ if(M<=D0*R){ box.innerHTML='<div class="al bad">El pago mensual no alcanza a cubrir los intereses: la deuda crecería para siempre.</div>'; return; } n=Math.ceil(-Math.log(1-D0*R/M)/Math.log(1+R)); }
 const total=M*n, interes=total-D0;
 const fecha=new Date(hoy); fecha.setMonth(fecha.getMonth()+n);
 const txt=n>=12?Math.floor(n/12)+' año(s) y '+(n%12)+' mes(es)':n+' meses';
 box.innerHTML='<div class="res3"><div><div class="mut small">Libres de deuda en</div><b>'+txt+'</b></div><div><div class="mut small">Fecha estimada</div><b>'+mesTxt(fecha)+'</b></div><div><div class="mut small">Intereses totales</div><b>'+fmt(interes)+'</b></div></div>'
 +'<div class="al ok">Pagando '+fmt(M)+'/mes terminarían alrededor de '+mesTxt(fecha)+'.</div>';
}
function short(v){ if(v>=1e9)return (v/1e9).toFixed(1)+'B'; if(v>=1e6)return '$'+(v/1e6).toFixed(v>=1e7?0:1)+'M'; if(v>=1e3)return '$'+Math.round(v/1e3)+'K'; return '$'+Math.round(v); }
function donut(cv,items,center){
 if(!cv)return; const s=2; cv.width=cv.offsetWidth*s; cv.height=230*s; cv.style.height='230px';
 const ctx=cv.getContext('2d'); const cx=cv.width/2, cy=cv.height/2, r=Math.min(cx,cy)-40;
 ctx.lineWidth=36; const total=items.reduce((x,i)=>x+i.value,0);
 if(total<=0){ ctx.strokeStyle='#20294a'; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.stroke(); }
 let a=-Math.PI/2;
 items.forEach(i=>{ const ang=i.value/total*Math.PI*2; ctx.strokeStyle=i.color; ctx.beginPath(); ctx.arc(cx,cy,r,a,a+ang); ctx.stroke(); a+=ang; });
 ctx.fillStyle='#e9edf7'; ctx.font='bold 30px system-ui'; ctx.textAlign='center'; ctx.fillText(center,cx,cy);
 ctx.font='20px system-ui'; ctx.fillStyle='#8d99b8'; ctx.fillText('total',cx,cy+32);
}
function areaChart(cv,pts){
 if(!cv)return; const s=2; cv.width=cv.offsetWidth*s; cv.height=240*s; cv.style.height='240px';
 const ctx=cv.getContext('2d'); const W=cv.width,H=cv.height,padL=110,padR=20,padT=20,padB=50;
 const max=Math.max(...pts,1);
 const X=i=>padL+(W-padL-padR)*i/(pts.length-1||1);
 const Y=v=>padT+(H-padT-padB)*(1-v/max);
 ctx.strokeStyle='#20294a'; ctx.fillStyle='#8d99b8'; ctx.font='18px system-ui'; ctx.textAlign='right';
 for(let g=0;g<=4;g++){ const v=max*g/4, y=Y(v); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke(); ctx.fillText(short(v),padL-10,y+6); }
 const grad=ctx.createLinearGradient(0,padT,0,H-padB); grad.addColorStop(0,'rgba(109,127,245,.45)'); grad.addColorStop(1,'rgba(109,127,245,0)');
 ctx.beginPath(); ctx.moveTo(X(0),Y(pts[0])); pts.forEach((v,i)=>ctx.lineTo(X(i),Y(v))); ctx.lineTo(X(pts.length-1),H-padB); ctx.lineTo(X(0),H-padB); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
 ctx.beginPath(); pts.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v))); ctx.strokeStyle='#6d7ff5'; ctx.lineWidth=4; ctx.stroke();
 ctx.fillStyle='#8d99b8'; ctx.textAlign='center';
 const step=Math.max(1,Math.round(pts.length/6));
 for(let i=0;i<pts.length;i+=step){ ctx.fillText('año '+Math.round(i/12),X(i),H-14); }
}
function barsChart(cv,labels,series){
 if(!cv)return; const s=2; cv.width=cv.offsetWidth*s; cv.height=260*s; cv.style.height='260px';
 const ctx=cv.getContext('2d'); const W=cv.width,H=cv.height,padL=110,padR=20,padT=20,padB=60;
 const max=Math.max(1,...series.flatMap(sr=>sr.data));
 const Y=v=>padT+(H-padT-padB)*(1-v/max);
 ctx.strokeStyle='#20294a'; ctx.fillStyle='#8d99b8'; ctx.font='18px system-ui'; ctx.textAlign='right';
 for(let g=0;g<=4;g++){ const v=max*g/4,y=Y(v); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke(); ctx.fillText(short(v),padL-10,y+6); }
 const n=labels.length||1; const groupW=(W-padL-padR)/n; const barW=Math.min(46*s,(groupW*0.68)/series.length);
 labels.forEach((lab,i)=>{
  const cx0=padL+groupW*i+groupW/2;
  series.forEach((sr,si)=>{
   const x=cx0-(series.length*barW)/2+si*barW;
   const val=sr.data[i]||0; const y=Y(val);
   ctx.fillStyle=sr.color;
   ctx.fillRect(x,y,barW-4*s,(H-padB)-y);
  });
  ctx.fillStyle='#8d99b8'; ctx.textAlign='center'; ctx.font='17px system-ui';
  ctx.fillText(lab,cx0,H-18*s);
 });
}

function genConsejos(s){
 const C=[];
 const gC=gastosPorCat(mesActual());
 if(s.ingresos<=0){ C.push({nivel:'warn',icon:'💵',titulo:'Registren sus ingresos mensuales',texto:'Vayan a Ingresos y anoten el sueldo líquido de cada uno.'}); }
 else{
  const pct=Math.round(s.carga*100);
  if(s.carga>0.5)C.push({nivel:'bad',icon:'⚖️',titulo:'Carga financiera crítica ('+pct+'%)',texto:'Más de la mitad de los ingresos está comprometida. Prioridad: congelar tarjetas y atacar las deudas en mora.'});
  else if(s.carga>0.35)C.push({nivel:'warn',icon:'⚖️',titulo:'Carga financiera alta ('+pct+'%)',texto:'Destinan '+pct+'% a obligaciones. Lo ideal es menos del 35%.'});
  else C.push({nivel:'ok',icon:'⚖️',titulo:'Carga financiera saludable ('+pct+'%)',texto:'Buena proporción de obligaciones respecto a ingresos.'});
  const real=s.capacidad-s.gastos-s.autoAporte;
  if(s.gastos>0&&real<0)C.push({nivel:'bad',icon:'💸',titulo:'Gastos superan lo disponible',texto:'Este mes llevan '+fmt(s.gastos)+' en gastos. Están '+fmt(-real)+' sobre lo disponible tras obligaciones y ahorro.'});
  if(s.deudaTotal>s.ingresos*10)C.push({nivel:'warn',icon:'🔁',titulo:'Evalúen consolidar deudas',texto:'La deuda equivale a '+(s.deudaTotal/s.ingresos).toFixed(0)+' meses de ingreso. Un crédito consolidado podría reducir cuota e intereses.'});
 }
 if(s.mora.length)C.push({nivel:'bad',icon:'🚨',titulo:s.mora.length+' deudas en mora ('+fmt(s.moraTotal)+')',texto:s.mora.map(d=>d.nombre).join(', ')+'. Contacten a cada entidad para repactar en cuotas fijas.'});
 const ex=db.deudas.filter(d=>d.estado!=='Pagada'&&d.limite>0&&d.saldo>d.limite);
 if(ex.length)C.push({nivel:'warn',icon:'💳',titulo:'Tarjetas sobre su cupo',texto:ex.map(d=>d.nombre).join(', ')+' están sobre su límite. Mantengan el uso bajo el 30% del cupo.'});
 const objetivo=s.obligaciones*3;
 if(objetivo>0)C.push({nivel:'info',icon:'🛡️',titulo:'Fondo de emergencia recomendado',texto:'Apunten a '+fmt(objetivo)+' (3 meses de obligaciones). Usen cuentas líquidas como BancoEstado o Renta Diaria de Scotiabank.'});
 const overB=Object.entries(db.presupuesto||{}).filter(([c,l])=>l>0&&(gC[c]||0)>l);
 if(overB.length)C.push({nivel:'warn',icon:'🎛️',titulo:'Presupuestos excedidos: '+overB.length+' categoría(s)',texto:overB.map(([c,l])=>c+' ('+fmt(gC[c])+' de '+fmt(l)+')').join(', ')+'.'});
 if(s.autoAporte>0)C.push({nivel:'ok',icon:'⚡',titulo:'Ahorro automático activo: '+fmt(s.autoAporte)+'/mes',texto:'Tienen aportes automáticos programados a sus metas. Se aplican una vez al mes y ya están descontados del "Libre del mes". ¡Automatizar es la mejor forma de ahorrar!'});
 else C.push({nivel:'info',icon:'⚡',titulo:'Activen el ahorro automático',texto:'En Metas, asignen un "aporte automático mensual" a cada meta. Se descontará de su presupuesto y se aplicará solo cada mes.'});
 if(db.metas.length){ const ah=db.metas.reduce((a,mt)=>a+(+mt.ahorrado||0),0); const obj=db.metas.reduce((a,mt)=>a+(+mt.objetivo||0),0);
  C.push({nivel:'info',icon:'🎯',titulo:'Metas de ahorro: '+Math.round(ah/(obj||1)*100)+'% de avance',texto:'Llevan '+fmt(ah)+' de '+fmt(obj)+' en '+db.metas.length+' meta(s).'}); }
 if(db.cuentas.length>25)C.push({nivel:'info',icon:'🏦',titulo:db.cuentas.length+' cuentas registradas',texto:'Revisen cuáles no usan hace 6+ meses y considérenlas cerrar para simplificar el control.'});
 return C;
}

function aplicarImport(d){

function importar(inp){
 const f=inp.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=e=>{
  let obj; try{ obj=JSON.parse(e.target.result); }catch(err){ alert('Archivo inválido ❌'); inp.value=''; return; }
  if(obj&&obj.v===1&&obj.data&&obj.tag){
   showModal({title:'🔐 Respaldo cifrado detectado',values:{},fields:[{n:'pass',l:'Contraseña del respaldo',type:'password',req:1}],submit:data=>{
    const plain=decryptBackup(obj,data.pass);
    if(plain==null){ alert('Contraseña incorrecta o archivo corrupto ❌'); return false; }
    try{ const d=JSON.parse(plain); if(!d.deudas||!d.cuentas)throw 0; aplicarImport(d); alert('Respaldo cifrado importado ✅'); }
    catch(err){ alert('Contenido inválido ❌'); }
   }});
  } else if(obj&&obj.deudas&&obj.cuentas){
   aplicarImport(obj); alert('Datos importados correctamente ✅');
  } else alert('Archivo inválido ❌');
 };
 r.readAsText(f); inp.value='';
}

  setTimeout(()=>{ const el=$('#lockPass'); if(el)el.focus(); },50);
 } else $('#lockScreen').style.display='none';
}
function tryUnlock(){
 const pass=$('#lockPass').value;
 if(hashPass(pass,db.config.passSalt)===db.config.passHash){
  $('#lockScreen').style.display='none';
  $('#lockPass').value='';
  $('#lockError').textContent='';
 } else {
  $('#lockError').textContent='Contraseña incorrecta. Intenta de nuevo.';
 }
}
