var sha256=function(ascii){
 function rightRotate(v,a){return (v>>>a)|(v<<(32-a));}
 var mathPow=Math.pow,maxWord=mathPow(2,32),len='length',i,j,result='';
 var words=[],asciiBitLength=ascii[len]*8;

 for(var candidate=2;primeCounter<64;candidate++){
  if(!isComposite[candidate]){
   for(i=0;i<313;i+=candidate)isComposite[i]=candidate;
   hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
   k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
  }
 }
 ascii+='\x80';
 while(ascii[len]%64-56)ascii+='\x00';
 for(i=0;i<ascii[len];i++){j=ascii.charCodeAt(i);if(j>>8)return;words[i>>2]|=j<<((3-i)%4)*8;}
 words[words[len]]=((asciiBitLength/maxWord)|0);

  var w=words.slice(j,j+=16),oldHash=hash;hash=hash.slice(0,8);

  }
  for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;
 }
 for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16);}}

/* ============ CÁLCULOS ============ */
function gastosDelMes(){ const m=mesActual(); return db.gastos.filter(g=>g.fecha&&g.fecha.startsWith(m)).reduce((a,g)=>a+(+g.monto||0),0); }
function stats(){
 const act=db.deudas.filter(d=>d.estado!=='Pagada');
 const deudaTotal=act.reduce((a,d)=>a+(+d.saldo||0),0);
 const cuotas=act.reduce((a,d)=>a+(+d.cuota||0),0);
 const mora=act.filter(d=>d.estado==='En mora');
 const moraTotal=mora.reduce((a,d)=>a+(+d.saldo||0),0);
 const servicios=db.servicios.reduce((a,s)=>a+(+s.monto||0),0);
 const ingresos=db.ingresos.reduce((a,i)=>a+(+i.monto||0),0);
 const obligaciones=cuotas+servicios;
 const gastos=gastosDelMes();
 const capacidad=ingresos-obligaciones;
 const carga=ingresos>0?obligaciones/ingresos:null;
 const porPersona={}; PERSONAS.forEach(p=>porPersona[p]=act.filter(d=>d.responsable===p).reduce((a,d)=>a+(+d.saldo||0),0));
 return {deudaTotal,cuotas,mora,moraTotal,servicios,ingresos,obligaciones,gastos,capacidad,carga,porPersona,nDeudas:act.length};
}
function alertas(s){
 const A=[];
 if(s.ingresos<=0)A.push({t:'warn',x:'<b>Faltan ingresos:</b> regístrenlos en la página <a class="link" onclick="nav(\'ingresos\')">Ingresos</a> para activar proyecciones y consejos personalizados.'});
 if(s.mora.length)A.push({t:'bad',x:'<b>'+s.mora.length+' deudas en mora</b> por '+fmt(s.moraTotal)+'. Revisa la página de Consejos para ver el plan de pago sugerido.'});
 const ex=db.deudas.filter(d=>d.estado!=='Pagada'&&d.limite>0&&d.saldo>d.limite);
 if(ex.length)A.push({t:'warn',x:'<b>Sobregiro:</b> '+ex.map(d=>esc(d.nombre)).join(', ')+'. Eviten nuevas compras con esas tarjetas.'});
 db.servicios.filter(x=>x.estado!=='Pagada'&&x.vence).forEach(x=>{ const d=diasHasta(x.vence); if(d<0)A.push({t:'bad',x:'<b>'+esc(x.nombre)+'</b> venció hace '+(-d)+' días ('+fmt(x.monto)+').'}); else if(d<=7)A.push({t:'warn',x:'<b>'+esc(x.nombre)+'</b> vence en '+d+' día(s) ('+fmt(x.monto)+').'}); });
 if(s.carga!=null&&s.carga>0.5)A.push({t:'bad',x:'<b>Carga financiera crítica:</b> el '+Math.round(s.carga*100)+'% de los ingresos se va en obligaciones (recomendado: bajo 35%).'});
 else if(s.carga!=null&&s.carga>0.35)A.push({t:'warn',x:'<b>Carga financiera alta:</b> '+Math.round(s.carga*100)+'% de los ingresos en obligaciones.'});
 return A;
}

const META_COLORS=['#6d7ff5','#22d3ee','#34d399','#f59e0b','#f472b6','#a78bfa','#fbbf24','#38bdf8'];
function vMetas(){
 return '<div class="toolbar"><span class="spacer"></span><button class="btn primary" onclick="metaModal()">＋ Nueva meta de ahorro</button></div>'
 +'<div id="metas-sum"></div>'
 +'<div class="grid2" id="metas-grid"></div>';
}
function fillMetas(){
 const totalAh=db.metas.reduce((a,m)=>a+(+m.ahorrado||0),0);
 const totalObj=db.metas.reduce((a,m)=>a+(+m.objetivo||0),0);
 $('#metas-sum').innerHTML='<div class="chips"><span class="chip">Total ahorrado: <b>'+fmt(totalAh)+'</b></span><span class="chip">Meta total: <b>'+fmt(totalObj)+'</b></span>'+(totalObj?'<span class="chip">Avance: <b>'+Math.round(totalAh/totalObj*100)+'%</b></span>':'')+'</div>';
 if(!db.metas.length){ $('#metas-grid').innerHTML='<div class="card" style="grid-column:1/-1"><p class="mut">Aún no tienen metas de ahorro. Creen la primera, por ejemplo un fondo de emergencia, un viaje o la cuota inicial de algo. 🎯</p></div>'; return; }
 $('#metas-grid').innerHTML=db.metas.map((m,i)=>{
   const pct=Math.min(100,Math.round((+m.ahorrado||0)/(+m.objetivo||1)*100));
   const color=META_COLORS[i%META_COLORS.length];
   const faltante=Math.max(0,(+m.objetivo||0)-(+m.ahorrado||0));
   let guia='';
   if(m.plazo&&faltante>0){
     const plazo=new Date(m.plazo+'T00:00:00');
     const months=Math.max(1,Math.round((plazo-new Date())/(30*864e5)));
     const req=faltante/months;
     guia='<p class="mut small" style="margin-top:8px">Para llegar al '+fdate(m.plazo)+' necesitan ahorrar ~<b style="color:'+color+'">'+fmt(req)+'/mes</b> ('+months+' meses).</p>';
   } else if(faltante<=0){
     guia='<p class="small" style="margin-top:8px;color:#2dd4a7">✅ ¡Meta cumplida!</p>';
   }
   return '<div class="card">'
     +'<div class="person-head"><span class="avatar" style="background:'+color+'">'+esc((m.nombre||'?')[0])+'</span><div><h3>'+esc(m.nombre)+'</h3><div class="mut small">'+esc(m.responsable||'—')+'</div></div>'
     +'<div style="margin-left:auto" class="acts"><button class="ibtn" title="Abonar" onclick="abonoModal(\''+m.id+'\')">💰</button><button class="ibtn" onclick="metaModal(\''+m.id+'\')">✏️</button><button class="ibtn" onclick="delMeta(\''+m.id+'\')">🗑️</button></div></div>'
     +'<div class="big" style="color:'+color+'">'+pct+'%</div>'
     +'<div class="bar-track" style="height:14px;margin:8px 0"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'
     +'<div class="mut small">Ahorrado: <b>'+fmt(m.ahorrado)+'</b> de '+fmt(m.objetivo)+' · Falta: <b>'+fmt(faltante)+'</b></div>'
     +guia
     +'</div>';
 }).join('');
}

/* --- Proyecciones --- */
function vProy(){
 const s=stats();
 return '<div class="grid2"><div class="card"><h3>💰 Proyección de ahorro</h3>'
 +'<div class="fgrid"><label>Monto inicial ($)<input type="number" id="pa0" value="0" oninput="calcAhorro()"></label>'
 +'<label>Aporte mensual ($)<input type="number" id="pam" value="100000" oninput="calcAhorro()"></label>'
 +'<label>Rentabilidad anual (%)<input type="number" id="par" value="8" step="0.1" oninput="calcAhorro()"></label>'
 +'<label>Años<input type="number" id="pay" value="5" min="1" max="40" oninput="calcAhorro()"></label></div>'
 +'<div class="res3"><div><div class="mut small">Monto final</div><b id="rFinal">—</b></div><div><div class="mut small">Total aportado</div><b id="rAportes">—</b></div><div><div class="mut small">Intereses ganados</div><b id="rInt">—</b></div></div>'
 +'<canvas id="cAhorro"></canvas></div>'
 +'<div class="card"><h3>🎯 Plan para salir de deudas</h3>'
 +'<div class="fgrid"><label>Deuda total ($)<input type="number" id="pd0" value="'+Math.round(s.deudaTotal)+'" oninput="calcDeuda()"></label>'
 +'<label>Pago mensual ($)<input type="number" id="pdm" value="'+Math.round(s.cuotas||200000)+'" oninput="calcDeuda()"></label>'
 +'<label>Tasa anual promedio (%)<input type="number" id="pdr" value="35" step="0.1" oninput="calcDeuda()"></label></div>'
 +'<div id="rDeuda"></div></div></div>'
 +'<div class="card"><h3>💡 Supuestos</h3><p class="mut small">Cálculos educativos con interés compuesto mensual. Úsenlos para comparar escenarios y definir metas realistas de ahorro y pago.</p></div>';
}
function calcAhorro(){
 const P=+($('#pa0').value)||0, A=+($('#pam').value)||0, R=(+($('#par').value)||0)/100;
 const Y=Math.max(1,Math.min(40,+($('#pay').value)||1));
 const r=R/12, n=Y*12; const pts=[P]; let v=P;
 for(let m=1;m<=n;m++){ v=v*(1+r)+A; pts.push(v); }
 $('#rFinal').textContent=fmt(v);
 $('#rAportes').textContent=fmt(P+A*n);
 $('#rInt').textContent=fmt(v-(P+A*n));
 areaChart($('#cAhorro'),pts);
}
function calcDeuda(){
 const D0=+($('#pd0').value)||0, M=+($('#pdm').value)||0, R=(+($('#pdr').value)||0)/100/12;
 const box=$('#rDeuda');
 if(D0<=0){ box.innerHTML='<div class="al ok">Sin deuda registrada. 🎉</div>'; return; }
 if(M<=0){ box.innerHTML=''; return; }
 let n;
 if(R===0){ n=Math.ceil(D0/M); }
 else{ if(M<=D0*R){ box.innerHTML='<div class="al bad">El pago mensual no alcanza a cubrir los intereses: la deuda crecería para siempre. Aumenten el pago o renegocien la tasa.</div>'; return; } n=Math.ceil(-Math.log(1-D0*R/M)/Math.log(1+R)); }
 const total=M*n, interes=total-D0;
 const fecha=new Date(hoy); fecha.setMonth(fecha.getMonth()+n);
 const txt=n>=12?Math.floor(n/12)+' año(s) y '+(n%12)+' mes(es)':n+' meses';
 box.innerHTML='<div class="res3"><div><div class="mut small">Libres de deuda en</div><b>'+txt+'</b></div><div><div class="mut small">Fecha estimada</div><b>'+mesTxt(fecha)+'</b></div><div><div class="mut small">Intereses totales</div><b>'+fmt(interes)+'</b></div></div>'
 +'<div class="al ok">Pagando '+fmt(M)+'/mes terminarían alrededor de '+mesTxt(fecha)+', pagando '+fmt(total)+' en total.</div>';
}
function short(v){ if(v>=1e9)return (v/1e9).toFixed(1)+'B'; if(v>=1e6)return '$'+(v/1e6).toFixed(v>=1e7?0:1)+'M'; if(v>=1e3)return '$'+Math.round(v/1e3)+'K'; return '$'+Math.round(v); }
function donut(cv,items,center){
 if(!cv)return; const s=2; cv.width=cv.offsetWidth*s; cv.height=230*s; cv.style.height='230px';
 const ctx=cv.getContext('2d'); const cx=cv.width/2, cy=cv.height/2, r=Math.min(cx,cy)-40;
 ctx.lineWidth=36; const total=items.reduce((x,i)=>x+i.value,0);
 if(total<=0){ ctx.strokeStyle='#20294a'; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.stroke(); }
 let a=-Math.PI/2;
 items.forEach(i=>{ const ang=i.value/total*Math.PI*2; ctx.strokeStyle=i.color; ctx.beginPath(); ctx.arc(cx,cy,r,a,a+ang); ctx.stroke(); a+=ang; });
 ctx.fillStyle='#e9edf7'; ctx.font='bold 30px system-ui'; ctx.textAlign='center'; ctx.fillText(center,cx,cy);
 ctx.font='20px system-ui'; ctx.fillStyle='#8d99b8'; ctx.fillText('total',cx,cy+32);
}
function areaChart(cv,pts){
 if(!cv)return; const s=2; cv.width=cv.offsetWidth*s; cv.height=240*s; cv.style.height='240px';
 const ctx=cv.getContext('2d'); const W=cv.width,H=cv.height,padL=110,padR=20,padT=20,padB=50;
 const max=Math.max(...pts,1);
 const X=i=>padL+(W-padL-padR)*i/(pts.length-1||1);
 const Y=v=>padT+(H-padT-padB)*(1-v/max);
 ctx.strokeStyle='#20294a'; ctx.fillStyle='#8d99b8'; ctx.font='18px system-ui'; ctx.textAlign='right';
 for(let g=0;g<=4;g++){ const v=max*g/4, y=Y(v); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke(); ctx.fillText(short(v),padL-10,y+6); }
 const grad=ctx.createLinearGradient(0,padT,0,H-padB); grad.addColorStop(0,'rgba(109,127,245,.45)'); grad.addColorStop(1,'rgba(109,127,245,0)');
 ctx.beginPath(); ctx.moveTo(X(0),Y(pts[0])); pts.forEach((v,i)=>ctx.lineTo(X(i),Y(v))); ctx.lineTo(X(pts.length-1),H-padB); ctx.lineTo(X(0),H-padB); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
 ctx.beginPath(); pts.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v))); ctx.strokeStyle='#6d7ff5'; ctx.lineWidth=4; ctx.stroke();
 ctx.fillStyle='#8d99b8'; ctx.textAlign='center';
 const step=Math.max(1,Math.round(pts.length/6));
 for(let i=0;i<pts.length;i+=step){ ctx.fillText('año '+Math.round(i/12),X(i),H-14); }
}

/* --- Consejos --- */
function genConsejos(s){
 const C=[];
 if(s.ingresos<=0){ C.push({nivel:'warn',icon:'💵',titulo:'Registren sus ingresos mensuales',texto:'Vayan a la página Ingresos y anoten el sueldo líquido de cada uno. Con eso se activan la carga financiera, la capacidad de ahorro y todos los consejos personalizados.'}); }
 else{
  const pct=Math.round(s.carga*100);
  if(s.carga>0.5)C.push({nivel:'bad',icon:'⚖️',titulo:'Carga financiera crítica ('+pct+'%)',texto:'Más de la mitad de los ingresos está comprometida en deudas y cuentas. Lo recomendado es no superar el 35%. Prioridad uno: congelar el uso de tarjetas y atacar las deudas en mora (ver método Bola de Nieve más abajo).'});
  else if(s.carga>0.35)C.push({nivel:'warn',icon:'⚖️',titulo:'Carga financiera alta ('+pct+'%)',texto:'Están destinando '+pct+'% de los ingresos a obligaciones. Idealmente debe ser menos del 35%. Renegocien cuotas y eviten nuevos créditos.'});
  else C.push({nivel:'ok',icon:'⚖️',titulo:'Carga financiera saludable ('+pct+'%)',texto:'La proporción de obligaciones respecto a ingresos está en rango sano. Mantengan el equilibrio y aprovechen de ahorrar.'});
  const real=s.capacidad-s.gastos;
  if(s.gastos>0&&real<0)C.push({nivel:'bad',icon:'💸',titulo:'Gastos variables superan lo disponible',texto:'Este mes llevan '+fmt(s.gastos)+' en gastos variables. Después de obligaciones quedan '+fmt(s.capacidad)+', así que están '+fmt(-real)+' sobre lo disponible. Revisen la página Gastos para identificar dónde recortar.'});
  else if(s.gastos>0)C.push({nivel:'info',icon:'💸',titulo:'Gastos variables del mes: '+fmt(s.gastos),texto:'Tras pagar obligaciones ('+fmt(s.obligaciones)+') y gastar '+fmt(s.gastos)+', les quedan '+fmt(real)+' este mes. Registren sus gastos cada semana para mantener el control.'});
  if(s.deudaTotal>s.ingresos*10)C.push({nivel:'warn',icon:'🔁',titulo:'Evalúen consolidar deudas',texto:'La deuda total equivale a '+(s.deudaTotal/s.ingresos).toFixed(0)+' meses de ingreso familiar. Un crédito consolidado (BancoEstado o Scotiabank suelen tener tasas más bajas que el retail) podría reducir cuota e intereses, y permitir cerrar varias tarjetas de casas comerciales.'});
 }
 if(s.mora.length)C.push({nivel:'bad',icon:'🚨',titulo:s.mora.length+' deudas en mora ('+fmt(s.moraTotal)+')',texto:s.mora.map(d=>d.nombre).join(', ')+'. La mora genera intereses penales y daña el informe comercial (DICOM). Contacten a cada entidad para repactar en cuotas fijas; eviten pagar solo el mínimo, porque principalmente cubre intereses.'});
 const ex=db.deudas.filter(d=>d.estado!=='Pagada'&&d.limite>0&&d.saldo>d.limite);
 if(ex.length)C.push({nivel:'warn',icon:'💳',titulo:'Tarjetas sobre su cupo',texto:ex.map(d=>d.nombre).join(', ')+' están por sobre su límite. Paguen el exceso y procuren mantener el uso bajo el 30% del cupo para cuidar el score crediticio.'});
 const objetivo=s.obligaciones*3;
 if(objetivo>0)C.push({nivel:'info',icon:'🛡️',titulo:'Fondo de emergencia recomendado',texto:'Apunten a '+fmt(objetivo)+' (3 meses de obligaciones: '+fmt(s.obligaciones)+'/mes). Pueden usar las cuentas de ahorro de BancoEstado o las Renta Diaria de Scotiabank, que son líquidas y rentan algo. Metas escalonadas: primero $100.000, luego 1 mes, luego 3.'});
 if(db.metas.length){ const ah=db.metas.reduce((a,m)=>a+(+m.ahorrado||0),0); const obj=db.metas.reduce((a,m)=>a+(+m.objetivo||0),0);
  C.push({nivel:'info',icon:'🎯',titulo:'Metas de ahorro: '+Math.round(ah/(obj||1)*100)+'% de avance',texto:'Llevan '+fmt(ah)+' ahorrados de '+fmt(obj)+' en '+db.metas.length+' meta(s). Mantengan abonos constantes; automaticen una transferencia el día de sueldo.'}); }
 if(db.cuentas.length>25)C.push({nivel:'info',icon:'🏦',titulo:db.cuentas.length+' cuentas y billeteras registradas',texto:'Tener tantas cuentas activas dificulta el control y puede generar costos de mantención o fraudes dormidos. Revisen cuáles no usan hace 6+ meses y considérenlas cerrar. Las prepago sin uso (Tenpo, Prex, Global66, etc.) suelen ser fáciles de cerrar.'});
 const pac=db.deudas.find(d=>/pac/i.test(d.notas||''));
 if(pac)C.push({nivel:'info',icon:'📆',titulo:'Crédito con PAC (pago automático)',texto:'El crédito de BancoEstado de Elías se paga automáticamente desde la Cuenta RUT. Asegúrense de tener la cuota ('+fmt(pac.cuota)+') disponible antes del día 10 de cada mes para evitar mora e intereses.'});
 if(db.cuentas.some(c=>c.moneda==='USD'))C.push({nivel:'info',icon:'💱',titulo:'Diversificación en dólares',texto:'Bien: ya tienen cuentas en USD en Scotiabank. Mantener un 10–20% del ahorro en dólares protege contra la devaluación del peso.'});
 return C;
}

 +'<p class="mut small">⚠️ Esta contraseña protege el acceso visual a la app en este dispositivo. Los datos siguen en el navegador; para datos sensibles (CVV, números de tarjeta) usen la bóveda cifrada. Si olvidas la contraseña, deberás borrar los datos del navegador para volver a entrar.</p>'
 +'</div>'
 +'<div class="card"><h3>🔐 Privacidad y respaldo</h3><p class="mut">Todos los datos se guardan <b>localmente en este navegador</b> (localStorage). Nada sale de tu equipo. Para respaldar o migrar entre dispositivos, exporta el JSON.</p>'
 +'<div class="toolbar"><button class="btn primary" onclick="exportar()">⬇️ Exportar datos (JSON)</button>'
 +'<button class="btn" onclick="document.getElementById(\'impFile\').click()">⬆️ Importar datos</button>'
 +'<input type="file" id="impFile" accept=".json" hidden onchange="importar(this)">'
 +'<button class="btn warnb" onclick="resetSeed()">♻️ Restaurar datos base</button>'
 +'<button class="btn badb" onclick="wipe()">🗑️ Borrar todo</button></div></div>'
 +'<div class="card"><h3>📌 Notas</h3><ul class="mut small">'
 +'<li>Si luego suben la app a internet, los datos seguirán en el navegador de cada dispositivo; usen Exportar/Importar para sincronizar entre equipos.</li>'
 +'<li>Para datos sensibles de tarjetas (CVV, números completos) prefieran su bóveda cifrada (boveda_segura.html).</li>'
 +'<li>Recomendación: actualicen saldos, deudas, gastos y servicios una vez al mes (ideal el día 1) y exporten un respaldo.</li></ul></div>';
}
function passModal(){
 showModal({title:db.config.passHash?'Cambiar contraseña':'Crear contraseña',values:{},fields:[
  {n:'p1',l:'Nueva contraseña',type:'password',req:1},
  {n:'p2',l:'Repite la contraseña',type:'password',req:1}
 ],submit:data=>{
  if(data.p1.length<4){ alert('La contraseña debe tener al menos 4 caracteres.'); return false; }
  if(data.p1!==data.p2){ alert('Las contraseñas no coinciden.'); return false; }
  const salt=genSalt();
  db.config.passSalt=salt;
  db.config.passHash=hashPass(data.p1,salt);
  save();
  alert('✅ Contraseña guardada. Se pedirá cada vez que abras la app.');
 }});
}
function quitarPass(){
 if(confirm('¿Quitar la contraseña? La app se abrirá sin pedir clave.')){
  db.config.passHash=null; db.config.passSalt=null; save(); render();
 }
}
function exportar(){ const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='finanzas_re_'+new Date().toISOString().slice(0,10)+'.json'; a.click(); }
function importar(inp){ const f=inp.files[0]; if(!f)return; const r=new FileReader(); r.onload=e=>{ try{ const d=JSON.parse(e.target.result); if(!d.deudas||!d.cuentas)throw 0; db=d; save(); render(); alert('Datos importados correctamente ✅'); }catch(err){ alert('Archivo inválido ❌'); } }; r.readAsText(f); inp.value=''; }
function resetSeed(){ if(confirm('¿Restaurar los datos base (los del Excel original)? Se perderán los cambios actuales.')){ db=seed(); save(); render(); } }
function wipe(){ if(confirm('¿Borrar TODOS los datos?')){ db={ingresos:[],deudas:[],servicios:[],cuentas:[],gastos:[],metas:[],config:{passHash:null,passSalt:null}}; save(); render(); } }

/* ============ MODAL ============ */
function showModal(o){
 const root=$('#modal'); const vals=o.values||{};
 const rows=o.fields.map(f=>{
  const v=vals[f.n]??''; let ctl;
  if(f.type==='select'){ ctl='<select name="'+f.n+'">'+f.opts.map(op=>'<option '+(String(op)===String(v)?'selected':'')+'>'+esc(op)+'</option>').join('')+'</select>'; }
  else{ ctl='<input name="'+f.n+'" type="'+(f.type||'text')+'" value="'+esc(v)+'" '+(f.step?'step="'+f.step+'"':'')+' '+(f.req?'required':'')+' placeholder="'+esc(f.ph||'')+'">'; }
  return '<label>'+esc(f.l)+ctl+'</label>';
 }).join('');
 root.innerHTML='<div class="back" onclick="if(event.target===this)closeModal()"><div class="box"><h3>'+esc(o.title)+'</h3><form>'+rows+'<div class="acts2"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button type="button" class="btn primary" id="msave">Guardar</button></div></form></div></div>';
 $('#msave').onclick=()=>{
  const form=root.querySelector('form');
  if(!form.reportValidity())return;
  const data={};
  o.fields.forEach(f=>{ const el=form.querySelector('[name="'+f.n+'"]'); data[f.n]=f.type==='number'?(parseFloat(el.value)||0):el.value.trim(); });
  const r=o.submit(data);
  if(r===false)return;
  closeModal(); render();
 };
}
function closeModal(){ $('#modal').innerHTML=''; }

/* ============ ROUTER ============ */
const VIEWS={dashboard:vDashboard,deudas:vDeudas,servicios:vServicios,gastos:vGastos,cuentas:vCuentas,ingresos:vIngresos,metas:vMetas,proyecciones:vProy,consejos:vConsejos,ajustes:vAjustes};
const TITLES={dashboard:'📊 Dashboard',deudas:'💳 Deudas',servicios:'🔌 Servicios y pagos',gastos:'💸 Gastos variables',cuentas:'🏦 Cuentas',ingresos:'💵 Ingresos',metas:'🎯 Metas de ahorro',proyecciones:'📈 Proyecciones',consejos:'💡 Consejos financieros',ajustes:'⚙️ Ajustes'};
let view='dashboard';
function nav(v){
 view=v;
 document.querySelectorAll('aside .ni').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
 $('#title').textContent=TITLES[v];
 $('#view').innerHTML=VIEWS[v]();
 if(v==='dashboard')drawDash();
 if(v==='deudas')fillDeudas();
 if(v==='servicios')fillServ();
 if(v==='gastos')fillGastos();
 if(v==='cuentas')fillCuentas();
 if(v==='metas')fillMetas();
 if(v==='proyecciones'){ calcAhorro(); calcDeuda(); }
 window.scrollTo(0,0);
}
function render(){ nav(view); }
let rT; window.addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if(view==='dashboard')drawDash(); if(view==='gastos')fillGastos(); if(view==='proyecciones')calcAhorro(); },200); });

/* ============ BLOQUEO ============ */
function initLock(){
 if(db.config&&db.config.passHash){
  $('#lockScreen').style.display='flex';
  setTimeout(()=>{ const el=$('#lockPass'); if(el)el.focus(); },50);
 } else $('#lockScreen').style.display='none';
}
function tryUnlock(){
 const pass=$('#lockPass').value;
 if(hashPass(pass,db.config.passSalt)===db.config.passHash){
  $('#lockScreen').style.display='none';
  $('#lockPass').value='';
  $('#lockError').textContent='';
 } else {
  $('#lockError').textContent='Contraseña incorrecta. Intenta de nuevo.';
 }
}

/* ============ INICIO ============ */
$('#hoy').textContent=hoy.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
nav('dashboard');
initLock();
</script>
</body>
</html>
